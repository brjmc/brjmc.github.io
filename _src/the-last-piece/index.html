<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#120b0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="The Last Piece. You are the last piece of sushi on the plate. He wants you. Put wasabi in his eye." />
    <title>The Last Piece</title>
  </head>
  <body data-stage="title">
    <canvas id="c" aria-label="The Last Piece"></canvas>
    <div id="touch" aria-hidden="true"></div>

    <div class="hud">
      <div class="top">
        <div class="course" id="course"></div>
        <div class="meters">
          <div class="meter"><span class="lbl">Appetite</span><span class="pips" id="appetite"></span></div>
          <div class="meter"><span class="lbl">Fresh</span><span class="pips fresh" id="fresh"></span></div>
        </div>
      </div>
      <div class="cue" id="cue" role="status" aria-live="polite"></div>

      <div class="stick" id="stick" aria-hidden="true"><i></i></div>
      <div class="shot" id="shot" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>

      <div class="card" id="card" role="dialog" aria-live="polite">
        <div class="slip">
          <div class="kicker" id="card-kicker"></div>
          <h1 id="card-title"></h1>
          <div class="body" id="card-body"></div>
          <table class="bill" id="card-bill"></table>
          <div class="stamp" id="card-stamp"></div>
          <div class="foot" id="card-foot"></div>
        </div>
      </div>
    </div>

    <button id="throw" type="button" aria-label="Throw wasabi"><span>Throw</span></button>
    <div class="buttons">
      <button id="mute" type="button" aria-pressed="false">Sound</button>
      <button id="restart" type="button">Restart</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
